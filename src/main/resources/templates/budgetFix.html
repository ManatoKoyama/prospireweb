<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ja">
<head>
 予算FIX画面
    <meta charset="UTF-8" />
    <script src="https://unpkg.com/vue@next"></script>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
<body>  
  <div id="app" class="app-container">
    <div th:insert="fragments/menu_structure :: layoutContent"></div>
    <main class="content-area">
      <h2 class="main-title">予算FIX</h2>
       <div class="aaa">
        <h3>期選択</h3>
          <div>
            <select>
              <option>--期を選択--</option>
              <option th:each="term : ${terms}" 
                      th:value="${term}" 
                      th:text="${term}">
              </option>
            </select>
          </div>
        <h3>部署選択</h3>
          <div>
            <select v-model="selectedDepartment" @change="onDepartmentChange">
              <option value="">--部署を選択--</option>
              <option th:each="dept : ${departments}" 
                      :value="${dept}">
                [[${dept}]]
              </option>
            </select>
          </div>
        <h3>今期予算目標:</h3>
          <div>
            <h3> ¥{{ totalBudget }}</h3>
            <script>
            computed: {
              totalBudget();{
                return this.filteredBudgets.reduce((sum, b) => sum + b.amount, 0);
              }
            }
            </script>
          </div>
       </div>
      <table>
  <thead>
    <tr>
      <th>部署</th>
      <th>予算</th>
      <th>実績</th>
    </tr>
  </thead>
  <tbody>
    <tr v-for="budget in filteredBudgets" :key="budget.id">
      <td>{{ budget.department }}</td>
      <td>{{ budget.amount }}</td>
      <td>{{ budget.actual }}</td>
    </tr>
  </tbody>
</table>
  </div>
  <script>
    const { createApp } = Vue;

    createApp({
      data() {
        return {
          selectedDepartment: '',
          allBudgets: [],       // API から取得
          filteredBudgets: []   // 表示用
        }
      },
      computed: {
        totalBudget() {
          // filteredBudgets が数値であることを仮定
          return this.filteredBudgets.reduce((sum, b) => sum + (Number(b.amount) || 0), 0);
        }
      },
      methods: {
        applyFilter() {
          if (!this.selectedDepartment) {
            // 選択なしは全件表示（好みに合わせて）
            this.filteredBudgets = this.allBudgets.slice();
          } else {
            this.filteredBudgets = this.allBudgets
              .filter(b => b.department === this.selectedDepartment)
              .sort((a, b) => b.amount - a.amount); // 予算額降順（例）
          }
        }
      },
      watch: {
        selectedDepartment() {
          this.applyFilter();
        }
      },
      mounted() {
        // 初期ロード: 全件取得してフィルタ（選択が空なら全件）
        fetch('/api/budgets')
          .then(res => res.json())
          .then(data => {
            this.allBudgets = data;
            this.applyFilter();
          })
          .catch(err => {
            console.error('データ取得失敗', err);
          });
      }
    }).mount('#app');
  </script>
</body>

</html>
